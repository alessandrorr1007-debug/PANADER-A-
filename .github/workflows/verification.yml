name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ui.test.cjs
      - run: node tests/access.test.cjs
      - run: node tests/inventory.test.cjs
      - run: node tests/production.test.cjs
      - run: node tests/commerce.test.cjs
      - run: node tests/finance.test.cjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bakery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: bakery_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/database/mock-auth.sql -f database/tenant-foundation.sql -f tests/database/tenant-isolation.sql -f database/onboarding.sql -f tests/database/onboarding.sql -f database/inventory.sql -f tests/database/inventory.sql -f database/production.sql -f tests/database/production.sql -f database/commerce.sql -f tests/database/commerce.sql -f database/finance.sql -f tests/database/finance.sql -f database/subscriptions.sql -f tests/database/subscriptions.sql
