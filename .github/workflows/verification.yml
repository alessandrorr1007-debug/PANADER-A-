name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/unit/ui.test.cjs
      - run: node tests/integration/access.test.cjs
      - run: node tests/integration/inventory.test.cjs
      - run: node tests/integration/production.test.cjs
      - run: node tests/integration/commerce.test.cjs
      - run: node tests/integration/finance.test.cjs
      - run: node tests/integration/admin.test.cjs
      - run: node tests/unit/workspace.test.cjs
      - run: node tests/integration/repository-layout.test.cjs
      - run: node tests/integration/accounts-billing.test.cjs
      - run: node tests/integration/trial-once.test.cjs
      - run: node tests/integration/auth-security.test.cjs
      - run: node tests/integration/inventory-units.test.cjs
      - run: node tests/integration/inventory-lots.test.cjs
      - run: node tests/integration/employee-permissions.test.cjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bakery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: bakery_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/database/mock-auth.sql -f backend/database/tenant-foundation.sql -f tests/database/tenant-isolation.sql -f backend/database/onboarding.sql -f tests/database/onboarding.sql -f backend/database/inventory.sql -f tests/database/inventory.sql -f backend/database/production.sql -f tests/database/production.sql -f backend/database/commerce.sql -f tests/database/commerce.sql -f backend/database/finance.sql -f tests/database/finance.sql -f backend/database/subscriptions.sql -f tests/database/subscriptions.sql -f tests/database/mock-sessions.sql -f backend/database/accounts-billing.sql -f tests/database/accounts-billing.sql -f backend/database/trial-once.sql -f tests/database/trial-once.sql -f tests/database/mock-mfa.sql -f backend/database/auth-security.sql -f tests/database/auth-security.sql -f backend/database/inventory-costs.sql -f tests/database/inventory-costs.sql -f backend/database/inventory-lots.sql -f tests/database/inventory-lots.sql -f backend/database/employee-permissions.sql -f tests/database/employee-permissions.sql -f backend/database/inventory-adjustments.sql -f tests/database/inventory-adjustments.sql
