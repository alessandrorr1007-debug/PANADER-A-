<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panadería · SaaS</title>
<style>
:root{--bg:#f7f7f5;--paper:#fff;--ink:#222722;--muted:#69736b;--line:#e4e7e1;--brand:#38634e;--tint:#e8f0e9;--warm:#8d531e;--warmbg:#fff1db}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #729b83;outline-offset:2px}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}aside{background:var(--paper);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.5px}.mark{background:var(--brand);color:white;border-radius:12px;width:39px;height:39px;display:grid;place-items:center;font-size:22px}.muted,small{color:var(--muted)}small{font-size:12px}.workspace{border:1px solid var(--line);border-radius:12px;padding:10px}.workspace label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.workspace select{width:100%;border:0;background:transparent;font-weight:650;color:var(--ink)}nav{display:grid;gap:4px}nav p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:14px 10px 4px}nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;color:var(--muted);display:flex;gap:11px;align-items:center}nav button.active{background:var(--tint);color:var(--brand);font-weight:700}nav button:hover{background:var(--bg)}.foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0}main{min-width:0}header{background:var(--paper);border-bottom:1px solid var(--line);padding:15px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}.demo{background:var(--warmbg);color:var(--warm);font-size:12px;padding:5px 10px;border-radius:6px;font-weight:650}.content{max-width:1320px;margin:auto;padding:28px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}h1,h2,p{margin:0}h1{font-size:28px;letter-spacing:-.8px;line-height:1.2;margin-bottom:7px}h2{font-size:16px;letter-spacing:-.2px}.btn{border:1px solid var(--line);border-radius:8px;background:white;padding:9px 12px;color:var(--ink);white-space:nowrap}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0}.metric{font-size:27px;font-weight:750;letter-spacing:-.8px;margin:8px 0 2px}.columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.chart{height:200px;display:flex;gap:12px;align-items:flex-end;border-bottom:1px solid var(--line);padding:0 8px}.barcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.bar{background:#83ab92;width:65%;max-width:45px;border-radius:6px 6px 0 0}.barcol:last-child .bar{background:var(--brand)}.barcol small{padding-bottom:6px}.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.tag{font-size:12px;font-weight:650;background:var(--tint);color:var(--brand);padding:4px 8px;border-radius:6px;white-space:nowrap;align-self:center}.tag.warn{background:var(--warmbg);color:var(--warm)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left}th,td{padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600;background:#f8faf7}tbody tr:last-child td{border-bottom:0}.search{border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:min(100%,280px);background:#fff}.empty{padding:24px;text-align:center;color:var(--muted)}.mobile{display:none}footer{margin-top:20px;color:var(--muted);font-size:12px}.backdrop{display:none}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}
@media(max-width:700px){.shell{display:block}aside{display:none;position:fixed;left:0;top:0;width:min(270px,85vw);z-index:5;box-shadow:0 0 30px #0002}aside.open{display:flex}.backdrop.open{display:block;position:fixed;inset:0;background:#0005;z-index:4;border:0;width:100%}.mobile{display:inline-block}.content{padding:18px 14px}header{padding:12px 14px}.heading{flex-wrap:wrap}h1{font-size:24px}.card{padding:14px}.metrics{gap:9px}.metric{font-size:23px}.chart{gap:5px}.cardhead{flex-wrap:wrap}.demo{font-size:11px}}
</style></head>
<body><div class="shell"><button class="backdrop" id="backdrop" aria-label="Cerrar menú"></button><aside id="sidebar">
<div class="logo"><span class="mark" aria-hidden="true">♨</span><div>Panadería<small style="display:block;font-weight:400;letter-spacing:0">Gestión de negocios</small></div></div>
<div class="workspace"><label for="business">Negocio de demostración</label><select id="business"><option value="a">Panadería Aurora</option><option value="b">Panadería Trigal</option></select></div>
<nav id="nav" aria-label="Módulos"></nav><div class="foot"><strong>Cuenta de demostración</strong><br><small>Administrador · Sin conexión</small></div></aside>
<main><header><div><button class="btn mobile" id="menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">☰</button> <span class="muted" id="crumb">Inicio / Resumen</span></div><span class="demo">Modo demostración</span></header><div class="content" id="content"></div></main></div>
<script>
'use strict';
const sections=[['General',[['dashboard','▦','Resumen']]],['Operaciones',[['warehouse','▤','Almacén'],['ingredients','◈','Insumos'],['recipes','▧','Recetas'],['production','◷','Producción']]],['Comercial',[['sales','▣','Ventas'],['purchases','↓','Compras'],['reports','▥','Reportes']]],['Administración',[['settings','⚙','Configuración']]]];
const samples={a:{name:'Panadería Aurora',sales:1540,units:420,series:[510,680,590,810,960,1120,1540],stock:[['Harina de trigo',12,'kg',20,3.4],['Azúcar',8,'kg',10,4.2],['Levadura',2,'kg',3,18],['Mantequilla',15,'kg',5,22]],recipes:[['Pan francés',100,28.40],['Pan integral',60,32.10],['Croissant',40,48.50]],production:[['Lote A-001','Pan francés',100,'Completado'],['Lote A-002','Croissant',40,'Planificado']],moves:[['Entrada','Mantequilla','5 kg'],['Salida','Harina de trigo','8 kg'],['Entrada','Azúcar','10 kg']]},b:{name:'Panadería Trigal',sales:860,units:230,series:[210,330,420,390,520,720,860],stock:[['Harina de trigo',28,'kg',15,3.6],['Sal',2,'kg',4,1.8],['Aceite',6,'L',3,9.5]],recipes:[['Pan de yema',80,36],['Pan ciabatta',40,19]],production:[['Lote B-001','Pan de yema',80,'Completado']],moves:[['Entrada','Harina de trigo','20 kg'],['Salida','Aceite','2 L']]}};
let page='dashboard',tenant='a';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(n);
const tag=(s,w=false)=>'<span class="tag'+(w?' warn':'')+'">'+s+'</span>';
const low=d=>d.stock.filter(r=>r[1]<r[3]);
const heading=(title,desc,action='')=>'<div class="heading"><div><h1>'+title+'</h1><p class="muted">'+desc+'</p></div>'+action+'</div>';
const metric=(name,value,desc)=>'<section class="card"><small>'+name+'</small><div class="metric">'+value+'</div><small>'+desc+'</small></section>';
const table=(heads,rows)=>'<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="empty no-results" hidden>Sin resultados</p></div>';
const panel=(title,body,extra='')=>'<section class="card"><div class="cardhead"><h2>'+title+'</h2>'+extra+'</div>'+body+'</section>';
const search='<input class="search" id="filter" type="search" placeholder="Buscar en la tabla…" aria-label="Buscar en la tabla">';
const stockRows=d=>d.stock.map(r=>[r[0],r[1]+' '+r[2],r[3]+' '+r[2],money(r[4])+' / '+r[2],tag(r[1]<r[3]?'Stock bajo':'Disponible',r[1]<r[3])]);
function dashboard(d){const max=Math.max(...d.series);return heading('Resumen del negocio','Consulta la actividad de '+d.name+'.','<button class="btn primary" data-go="production">Ver producción</button>')+'<div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Importe simulado')+metric('Unidades vendidas',d.units,'Registro simulado')+metric('Insumos con stock bajo',low(d).length,'Por debajo del mínimo')+metric('Recetas activas',d.recipes.length,'Catálogo de ejemplo')+'</div><div class="columns">'+panel('Ventas de la semana','<div class="chart" role="img" aria-label="Ventas de ejemplo de lunes a domingo: '+d.series.join(', ')+' soles">'+d.series.map((v,i)=>'<div class="barcol"><small>'+v+'</small><div class="bar" style="height:'+Math.round(v/max*78)+'%"></div><small>'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i]+'</small></div>').join('')+'</div>', '<small>En soles · datos ficticios</small>')+panel('Alertas de inventario',low(d).map(r=>'<div class="item"><div><strong>'+r[0]+'</strong><br><small>Mínimo: '+r[3]+' '+r[2]+'</small></div>'+tag(r[1]+' '+r[2],true)+'</div>').join('')+'<button class="btn" data-go="warehouse" style="margin-top:12px">Ir al almacén</button>')+'</div>'+panel('Producción reciente',table(['Lote','Producto','Unidades','Estado'],d.production.map(r=>[...r.slice(0,3),tag(r[3],r[3]==='Planificado')])), '<button class="btn" data-go="production">Ver lotes</button>');}
function render(){const d=samples[tenant];const label=sections.flatMap(s=>s[1]).find(x=>x[0]===page)[2];$('crumb').textContent='Inicio / '+label;let content='';
switch(page){case 'dashboard':content=dashboard(d);break;
case 'warehouse':content=heading('Almacén','Existencias y movimientos de materias primas.')+panel('Inventario',table(['Insumo','Existencia','Mínimo','Costo unitario','Estado'],stockRows(d)),search)+'<div style="height:16px"></div>'+panel('Movimientos recientes',table(['Tipo','Insumo','Cantidad'],d.moves));break;
case 'ingredients':content=heading('Insumos','Consulta unidades, existencias y costos de referencia.')+panel('Catálogo de insumos',table(['Insumo','Existencia','Mínimo','Costo unitario','Estado'],stockRows(d)),search);break;
case 'recipes':content=heading('Recetas','Rendimientos y costos de referencia por lote.')+panel('Recetas registradas',table(['Producto','Rendimiento (unidades)','Costo por lote','Costo por unidad'],d.recipes.map(r=>[r[0],r[1],money(r[2]),money(r[2]/r[1])])),search);break;
case 'production':content=heading('Producción','Visualiza los lotes y sus estados.')+panel('Lotes de producción',table(['Lote','Producto','Unidades','Estado'],d.production.map(r=>[...r.slice(0,3),tag(r[3],r[3]==='Planificado')])),search);break;
case 'sales':content=heading('Ventas','Indicadores de ejemplo. El punto de venta aún no está implementado.')+'<div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Simulación')+metric('Unidades',d.units,'Simulación')+'</div>';break;
case 'purchases':content=heading('Compras','Abastecimiento y proveedores: módulo planificado.')+panel('Compras','<p class="muted">Todavía no se registran órdenes de compra ni proveedores.</p>');break;
case 'reports':content=heading('Reportes','Indicadores disponibles en esta demostración.')+'<div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Simulación')+metric('Insumos con stock bajo',low(d).length,'Simulación')+'</div>';break;
case 'settings':content=heading('Configuración','Espacio de trabajo y administración.')+panel('Negocio seleccionado','<strong>'+d.name+'</strong><p class="muted">El selector permite comparar dos conjuntos de datos ficticios. No existe autenticación ni aislamiento real de datos todavía.</p>');break;}
$('content').innerHTML=content+'<footer>Prototipo visual · Datos ficticios · Sin operaciones reales ni almacenamiento persistente.</footer>';document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.go===page);if(b.dataset.go===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const filter=$('filter');if(filter){const root=filter.closest('.card');filter.addEventListener('input',()=>{const q=filter.value.toLocaleLowerCase('es');let count=0;root.querySelectorAll('tbody tr').forEach(tr=>{tr.hidden=!tr.textContent.toLocaleLowerCase('es').includes(q);if(!tr.hidden)count++});root.querySelector('.no-results').hidden=count>0});}}
function setMenu(open){$('sidebar').classList.toggle('open',open);$('backdrop').classList.toggle('open',open);$('menu').setAttribute('aria-expanded',String(open));}
$('nav').innerHTML=sections.map(s=>'<p>'+s[0]+'</p>'+s[1].map(r=>'<button data-go="'+r[0]+'"><span aria-hidden="true">'+r[1]+'</span>'+r[2]+'</button>').join('')).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){page=b.dataset.go;render();setMenu(false);window.scrollTo(0,0)}});
$('business').addEventListener('change',e=>{tenant=e.target.value;render()});$('menu').addEventListener('click',()=>setMenu(!$('sidebar').classList.contains('open')));$('backdrop').addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});render();
</script></body></html>
