<head>

<title>Panadería · SaaS</title>
<style>
:root{color-scheme:light;--bg:#FAF6EF;--paper:#FFFFFF;--ink:#38271D;--muted:#6F5D50;--line:#E8DCCD;--brand:#8B451F;--tint:#F5E6D5;--warm:#844508;--warmbg:#FCE8BD;--accent:#C58B43;--surface:#FCF8F2;--hover:#F9F0E3;--shadow:0 2px 8px #62401e09}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,.tablewrap:focus-visible{outline:2px solid var(--brand);outline-offset:3px}button{transition:background .15s,border-color .15s}h1,h2,p{margin:0}h1{font-size:29px;letter-spacing:-1px;line-height:1.2;margin-bottom:6px}h2{font-size:16px;letter-spacing:-.25px}small,.muted{color:var(--muted)}small{font-size:12px}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}aside{background:var(--paper);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;scrollbar-width:thin}.logo{display:flex;align-items:center;gap:10px;padding:0 6px;font-size:20px;font-weight:780;letter-spacing:-.6px}.mark{background:var(--brand);color:white;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex-shrink:0}.workspace{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px}.workspace label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.workspace select{width:100%;border:0;background:transparent;font-weight:650;color:var(--ink)}nav{display:grid;gap:3px}nav p{font-size:10px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:10px 10px 3px}nav button{position:relative;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;color:var(--muted);display:flex;gap:11px;align-items:center;font-weight:550;min-height:40px}nav button:hover{background:var(--surface);color:var(--ink)}nav button.active{background:var(--tint);color:var(--brand);font-weight:720}nav button.active:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:4px;background:var(--brand)}.nav-icon{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.foot{display:flex;align-items:center;gap:10px;margin-top:auto;border-top:1px solid var(--line);padding:14px 4px 0}.foot strong{font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}main{min-width:0}header{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}.header-actions{display:flex;align-items:center;gap:14px}.header-business{font-size:12px;font-weight:650}.demo{background:var(--warmbg);color:var(--warm);font-size:11px;padding:5px 9px;border-radius:6px;font-weight:650;white-space:nowrap}.content{max-width:1450px;margin:auto;padding:26px 28px}.heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.heading h1:focus{outline:none}.eyebrow{display:block;font-size:10px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:7px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 13px;color:var(--ink);white-space:nowrap;font-size:13px;font-weight:650;min-height:39px}.btn:hover{border-color:var(--brand);background:var(--surface)}.primary{background:var(--brand);color:white;border-color:var(--brand)}.primary:hover{background:#743916}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.metrics.compact{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;box-shadow:var(--shadow)}.metric-card{padding:16px;display:flex;flex-direction:column;gap:8px}.metric-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px}.metric-label{font-size:12px;font-weight:650;color:var(--muted)}.metric-icon,.action-icon{width:34px;height:34px;background:var(--tint);color:var(--brand);border-radius:9px;display:grid;place-items:center;flex-shrink:0}.metric-icon.alert{background:var(--warmbg);color:var(--warm)}.metric{font-size:28px;font-weight:780;letter-spacing:-1px;line-height:1.15;font-variant-numeric:tabular-nums}.metric-card>small{font-size:11px}.columns{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;margin-bottom:16px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.cardhead h2{min-width:0}.subhead{font-size:12px;color:var(--muted);margin-top:3px}.chart-summary{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}.chart-total{font-weight:780;font-size:24px;letter-spacing:-.6px}.chart-area{display:grid;grid-template-columns:40px minmax(0,1fr);height:175px;gap:8px}.chart-axis{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding-bottom:25px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.chart{display:flex;gap:8px;align-items:stretch;min-width:0}.barcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}.bartrack{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0;background:repeating-linear-gradient(to top,var(--line) 0px,var(--line) 1px,transparent 1px,transparent 33.333%)}.bar{background:var(--accent);width:64%;max-width:38px;border-radius:5px 5px 0 0;position:relative}.barcol:last-child .bar{background:var(--brand)}.bar:hover{filter:brightness(.93)}.barcol small{font-size:11px;white-space:nowrap;line-height:20px}.item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.alert-info{min-width:0;flex:1}.alert-info strong{font-size:13px}.stock-track{height:5px;background:var(--tint);border-radius:5px;overflow:hidden;margin-top:8px;max-width:150px}.stock-track span{display:block;height:100%;background:var(--accent);border-radius:5px}.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;background:var(--tint);color:var(--brand);padding:4px 8px;border-radius:6px;white-space:nowrap;align-self:center}.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.tag.warn{background:var(--warmbg);color:var(--warm)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;scrollbar-width:thin}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}th,td{padding:12px 13px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);font-weight:700;background:var(--surface)}td:first-child{font-weight:650}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--surface)}.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.search,.filters select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--paper);min-width:0;font-size:12px}.search{width:190px}.filters select{max-width:100%}.summaryline{font-size:12px;color:var(--muted);margin-top:12px}.quick-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.quick-actions .btn{justify-content:flex-start;text-align:left;white-space:normal;padding:10px 12px}.action-copy{flex:1;min-width:0;display:grid;gap:2px}.action-copy small{font-weight:400;font-size:11px}.arrow{color:var(--muted);font-size:18px;line-height:1}.empty{padding:24px;text-align:center;color:var(--muted)}.empty[hidden],tr[hidden]{display:none}.empty-state{padding:28px 16px;text-align:center;display:grid;justify-items:center;gap:9px}.empty-state .action-icon{width:48px;height:48px}.mobile,.backdrop{display:none}.skip{position:fixed;top:-100px;left:10px;background:var(--paper);color:var(--ink);padding:12px;z-index:10}.skip:focus{top:8px}footer{margin-top:20px;color:var(--muted);font-size:11px;padding-top:12px;border-top:1px solid var(--line)}.section-gap{height:16px}
@media(max-width:1150px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.content{padding:22px}.quick-actions .action-copy small{display:none}}
@media(max-width:760px){.shell{display:block}aside{display:none;position:fixed;left:0;top:0;width:min(280px,85vw);z-index:5;box-shadow:0 0 30px #0002}aside.open{display:flex}.backdrop.open{display:block;position:fixed;inset:0;background:#38271D70;z-index:4;border:0;width:100%;padding:0}.mobile{display:inline-flex}.content{padding:18px 14px}header{padding:10px 14px;min-height:58px}.header-business{display:none}.heading{align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}h1{font-size:25px}.card{padding:14px}.metrics{gap:9px}.metrics.compact{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-card{padding:12px;gap:7px}.metric{font-size:23px}.metric-label{font-size:11px}.metric-icon{width:29px;height:29px}.metric-icon .nav-icon{width:16px;height:16px}.chart{gap:4px}.cardhead{flex-wrap:wrap}.filters{width:100%}.filters .search{flex:1;width:100px}.btn{min-height:44px}nav button{min-height:44px}.quick-actions{grid-template-columns:1fr;gap:6px}.quick-actions .action-copy small{display:block}.chart-area{height:160px}}
@media(max-width:350px){.metrics,.metrics.compact{grid-template-columns:1fr}.chart-axis{font-size:9px}.chart-area{grid-template-columns:30px minmax(0,1fr)}.barcol small{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.header-actions{flex-wrap:wrap;justify-content:flex-end}.header-actions a{text-decoration:none}@media(max-width:430px){.header-actions .demo{display:none}.header-actions a{font-size:11px;padding:6px 8px;min-height:36px}}
</style></head>
<body><a class="skip" href="#content">Saltar al contenido</a><div class="shell"><button class="backdrop" id="backdrop" aria-label="Cerrar menú"></button><aside id="sidebar">
<div class="logo"><span class="mark" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c-2-2-1-5 1-7l5-5c3-3 7-3 10 0s3 7 0 10l-5 5c-3 3-8 2-11-3Z"/><path d="m8 9 4 4m0-8 4 4m0-6 4 4"/></svg></span><div>Panadería<small style="display:block;font-weight:400;letter-spacing:0">Gestión de negocios</small></div></div>
<div class="workspace"><label for="business">Negocio de demostración</label><select id="business"><option value="a">Panadería Aurora</option><option value="b">Panadería Trigal</option></select></div>
<nav id="nav" aria-label="Módulos"></nav><div class="foot"><span class="avatar" aria-hidden="true">AD</span><div><strong>Administrador</strong><br><small>Cuenta de demostración</small></div></div></aside>
<main><header><div><button class="btn mobile" id="menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">☰</button> <span class="muted" id="crumb">Inicio / Resumen</span></div><div class="header-actions"><span id="header-business" class="header-business">Panadería Aurora</span><a class="btn" href="access.html">Acceso al negocio</a><span class="demo">Modo demostración</span></div></header><div class="content" id="content" tabindex="-1"></div></main></div>
<script>
'use strict';
const sections=[['General',[['dashboard','▦','Resumen']]],['Operaciones',[['warehouse','▤','Almacén'],['ingredients','◈','Insumos'],['recipes','▧','Recetas'],['production','◷','Producción']]],['Comercial',[['sales','▣','Ventas'],['purchases','↓','Compras'],['reports','▥','Reportes']]],['Administración',[['settings','⚙','Configuración']]]];
const samples={a:{name:'Panadería Aurora',sales:1540,units:420,series:[510,680,590,810,960,1120,1540],stock:[['Harina de trigo',12,'kg',20,3.4],['Azúcar',8,'kg',10,4.2],['Levadura',2,'kg',3,18],['Mantequilla',15,'kg',5,22]],recipes:[['Pan francés',100,28.40],['Pan integral',60,32.10],['Croissant',40,48.50]],production:[['Lote A-001','Pan francés',100,'Completado'],['Lote A-002','Croissant',40,'Planificado']],moves:[['Entrada','Mantequilla','5 kg'],['Salida','Harina de trigo','8 kg'],['Entrada','Azúcar','10 kg']]},b:{name:'Panadería Trigal',sales:860,units:230,series:[210,330,420,390,520,720,860],stock:[['Harina de trigo',28,'kg',15,3.6],['Sal',2,'kg',4,1.8],['Aceite',6,'L',3,9.5]],recipes:[['Pan de yema',80,36],['Pan ciabatta',40,19]],production:[['Lote B-001','Pan de yema',80,'Completado']],moves:[['Entrada','Harina de trigo','20 kg'],['Salida','Aceite','2 L']]}};
const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',warehouse:'M3 10l9-7 9 7v11H3z M7 21V11h10v10 M7 15h10 M7 18h10',ingredients:'M12 3l8 4v10l-8 4-8-4V7z M4 7l8 4 8-4 M12 11v10',recipes:'M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z M8 4v16 M11 9h5 M11 13h5',production:'M3 12h18 M5 12V8l4-4 4 4v4 M3 12v8h18v-8 M9 20v-4 M15 20v-4',sales:'M3 4h2l2 12h12l2-9H6 M9 21h.01 M18 21h.01',purchases:'M4 12v8h16v-8 M12 3v12 M7 10l5 5 5-5',reports:'M4 3v17h17 M8 16v-5 M13 16V6 M18 16v-8',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2'};
const icon=k=>'<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[k]+'"/></svg>';
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').trim();
const validPages=sections.flatMap(s=>s[1]).map(r=>r[0]);
const route=s=>validPages.includes(s)?s:'dashboard';
const matches=(text,q,status,selected)=>normalize(text).includes(normalize(q))&&(!selected||status===selected);
const chartSummary=d=>d.series.reduce((a,b)=>a+b,0);
let page=route(location.hash.slice(1)),tenant='a';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(n);
const tag=(s,w=false)=>'<span class="tag'+(w?' warn':'')+'">'+s+'</span>';
const low=d=>d.stock.filter(r=>r[1]<r[3]);
const heading=(title,desc,action='')=>'<div class="heading"><div><h1 tabindex="-1">'+title+'</h1><p class="muted">'+desc+'</p></div>'+action+'</div>';
const metric=(name,value,desc,k='reports',alert=false)=>'<section class="card metric-card"><div class="metric-top"><span class="metric-label">'+name+'</span><span class="metric-icon'+(alert?' alert':'')+'">'+icon(k)+'</span></div><div class="metric">'+value+'</div><small>'+desc+'</small></section>';
const table=(heads,rows)=>'<div class="tablewrap" tabindex="0" role="region" aria-label="Tabla desplazable"><table><thead><tr>'+heads.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr data-status="'+(r[r.length-1].toString().includes('Stock bajo')?'low':r[r.length-1].toString().includes('Disponible')?'ok':r[r.length-1].toString().includes('Planificado')?'planned':r[r.length-1].toString().includes('Completado')?'done':'')+'">'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="empty no-results" hidden>Sin resultados</p></div>';
const panel=(title,body,extra='')=>'<section class="card"><div class="cardhead"><h2>'+title+'</h2>'+extra+'</div>'+body+'</section>';
const search='<input class="search" id="filter" type="search" placeholder="Buscar en la tabla…" aria-label="Buscar en la tabla">';
const filters=kind=>'<div class="filters">'+search+(kind?'<select id="status-filter" aria-label="Filtrar por estado"><option value="">Todos los estados</option>'+(kind==='stock'?'<option value="low">Stock bajo</option><option value="ok">Disponible</option>':'<option value="planned">Planificado</option><option value="done">Completado</option>')+'</select>':'')+'</div>';
const quick=()=>'<div class="quick-actions">'+[['warehouse','Ver almacén','Existencias y movimientos'],['recipes','Consultar recetas','Rendimientos y costos'],['production','Ver producción','Lotes y estados']].map(([k,label,desc])=>'<button class="btn" data-go="'+k+'"><span class="action-icon">'+icon(k)+'</span><span class="action-copy">'+label+'<small>'+desc+'</small></span><span class="arrow" aria-hidden="true">›</span></button>').join('')+'</div>';
const stockRows=d=>d.stock.map(r=>[r[0],r[1]+' '+r[2],r[3]+' '+r[2],money(r[4])+' / '+r[2],tag(r[1]<r[3]?'Stock bajo':'Disponible',r[1]<r[3])]);
const inventoryMetrics=d=>'<div class="metrics compact">'+metric('Insumos registrados',d.stock.length,'Catálogo de ejemplo','ingredients')+metric('Stock bajo',low(d).length,'Requieren atención','warehouse',true)+metric('Disponibles',d.stock.length-low(d).length,'En el mínimo o por encima','warehouse')+'</div>';
const recipeMetrics=d=>'<div class="metrics compact">'+metric('Recetas registradas',d.recipes.length,'Catálogo de ejemplo','recipes')+metric('Rendimiento total',d.recipes.reduce((a,r)=>a+r[1],0),'Unidades por conjunto de lotes','production')+metric('Costo total por conjunto',money(d.recipes.reduce((a,r)=>a+r[2],0)),'Un lote de cada receta','reports')+'</div>';
const productionMetrics=d=>'<div class="metrics compact">'+metric('Lotes registrados',d.production.length,'Demostración','production')+metric('Completados',d.production.filter(r=>r[3]==='Completado').length,'Lotes finalizados','production')+metric('Planificados',d.production.filter(r=>r[3]==='Planificado').length,'Lotes pendientes','production',true)+'</div>';
function salesChart(d){const max=Math.max(100,Math.ceil(Math.max(...d.series)/300)*300);return '<div class="chart-summary"><span class="chart-total">'+money(chartSummary(d))+'</span><small>total semanal · simulado</small></div><div class="chart-area" role="img" aria-label="Ventas de ejemplo de lunes a domingo: '+d.series.join(', ')+' soles"><div class="chart-axis" aria-hidden="true">'+[max,max*2/3,max/3,0].map(v=>'<span>'+v+'</span>').join('')+'</div><div class="chart" aria-hidden="true">'+d.series.map((v,i)=>'<div class="barcol"><div class="bartrack"><div class="bar" title="'+['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][i]+': '+money(v)+'" style="height:'+Math.round(v/max*100)+'%"></div></div><small>'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i]+'</small></div>').join('')+'</div></div>';}
function dashboard(d){return '<div class="heading"><div><span class="eyebrow">Panel de control</span><h1 tabindex="-1">Resumen del negocio</h1><p class="muted">Consulta la actividad de '+d.name+'.</p></div><button class="btn primary" data-go="production">'+icon('production')+' Ver producción</button></div><div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Importe simulado','sales')+metric('Unidades vendidas',d.units,'Registro simulado','production')+metric('Insumos con stock bajo',low(d).length,'Por debajo del mínimo','warehouse',true)+metric('Recetas activas',d.recipes.length,'Catálogo de ejemplo','recipes')+'</div>'+quick()+'<div class="columns">'+panel('Ventas de la semana',salesChart(d),'<small>Últimos 7 días · ejemplo</small>')+panel('Alertas de inventario',(low(d).map(r=>'<div class="item"><div class="alert-info"><strong>'+r[0]+'</strong><br><small>Mínimo: '+r[3]+' '+r[2]+'</small><div class="stock-track" aria-hidden="true"><span style="width:'+Math.max(0,Math.min(100,r[1]/r[3]*100))+'%"></span></div></div>'+tag(r[1]+' '+r[2],true)+'</div>').join('')||'<p class="empty">No hay insumos por debajo del mínimo.</p>')+'<button class="btn" data-go="warehouse" style="margin-top:12px;width:100%">Ir al almacén <span aria-hidden="true">›</span></button>','<span class="tag warn">'+low(d).length+' alertas</span>')+'</div>'+panel('Producción reciente',table(['Lote','Producto','Unidades','Estado'],d.production.map(r=>[...r.slice(0,3),tag(r[3],r[3]==='Planificado')])), '<button class="btn" data-go="production">Ver lotes <span aria-hidden="true">›</span></button>');}
function render(){const d=samples[tenant];const label=sections.flatMap(s=>s[1]).find(x=>x[0]===page)[2];$('crumb').textContent='Inicio / '+label;$('header-business').textContent=d.name;let content='';
switch(page){case 'dashboard':content=dashboard(d);break;
case 'warehouse':content=heading('Almacén','Existencias y movimientos de materias primas.')+inventoryMetrics(d)+panel('Inventario',table(['Insumo','Existencia','Mínimo','Costo unitario','Estado'],stockRows(d)),filters('stock'))+'<div class="section-gap"></div>'+panel('Movimientos recientes',table(['Tipo','Insumo','Cantidad'],d.moves));break;
case 'ingredients':content=heading('Insumos','Consulta unidades, existencias y costos de referencia.')+inventoryMetrics(d)+panel('Catálogo de insumos',table(['Insumo','Existencia','Mínimo','Costo unitario','Estado'],stockRows(d)),filters('stock'));break;
case 'recipes':content=heading('Recetas','Rendimientos y costos de referencia por lote.')+recipeMetrics(d)+panel('Recetas registradas',table(['Producto','Rendimiento (unidades)','Costo por lote','Costo por unidad'],d.recipes.map(r=>[r[0],r[1],money(r[2]),money(r[2]/r[1])])),filters());break;
case 'production':content=heading('Producción','Visualiza los lotes y sus estados.')+productionMetrics(d)+panel('Lotes de producción',table(['Lote','Producto','Unidades','Estado'],d.production.map(r=>[...r.slice(0,3),tag(r[3],r[3]==='Planificado')])),filters('production'));break;
case 'sales':content=heading('Ventas','Indicadores de ejemplo. El punto de venta aún no está implementado.')+'<div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Simulación')+metric('Unidades',d.units,'Simulación','production')+'</div>'+panel('Ventas de la semana',salesChart(d));break;
case 'purchases':content=heading('Compras','Abastecimiento y proveedores: módulo planificado.')+panel('Compras','<div class="empty-state"><span class="action-icon">'+icon('purchases')+'</span><strong>Módulo en preparación</strong><p class="muted">Todavía no se registran órdenes de compra ni proveedores.</p><button class="btn" data-go="warehouse">Consultar almacén</button></div>');break;
case 'reports':content=heading('Reportes','Indicadores disponibles en esta demostración.')+'<div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Simulación')+metric('Insumos con stock bajo',low(d).length,'Simulación','warehouse',true)+'</div>'+panel('Ventas de la semana',salesChart(d));break;
case 'settings':content=heading('Configuración','Espacio de trabajo y administración.')+panel('Negocio seleccionado','<strong>'+d.name+'</strong><p class="muted">El selector permite comparar dos conjuntos de datos ficticios. No existe autenticación ni aislamiento real de datos todavía.</p>');break;}
$('content').innerHTML=content+'<footer>Prototipo visual · Datos ficticios · Sin operaciones reales ni almacenamiento persistente.</footer>';document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.go===page);if(b.dataset.go===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const filter=$('filter');if(filter){const root=filter.closest('.card');const status=$('status-filter');const rows=[...root.querySelectorAll('tbody tr')];const countLabel=document.createElement('p');countLabel.className='summaryline';countLabel.setAttribute('aria-live','polite');root.append(countLabel);const apply=()=>{let count=0;rows.forEach(tr=>{tr.hidden=!matches(tr.textContent,filter.value,tr.dataset.status,status?.value);if(!tr.hidden)count++});root.querySelector('.no-results').hidden=count>0;countLabel.textContent=count+' de '+rows.length+' registros'};filter.addEventListener('input',apply);status?.addEventListener('change',apply);apply();}}
function setMenu(open){$('sidebar').classList.toggle('open',open);$('backdrop').classList.toggle('open',open);$('menu').setAttribute('aria-expanded',String(open));}
$('nav').innerHTML=sections.map(s=>'<p>'+s[0]+'</p>'+s[1].map(r=>'<button data-go="'+r[0]+'">'+icon(r[0])+r[2]+'</button>').join('')).join('');
function navigate(next){page=route(next);render();setMenu(false);document.querySelector('h1')?.focus();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){if(location.hash.slice(1)===b.dataset.go)navigate(b.dataset.go);else location.hash=b.dataset.go}});
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){$('content').focus();return}navigate(location.hash.slice(1))});
$('business').addEventListener('change',e=>{tenant=e.target.value;render()});$('menu').addEventListener('click',()=>setMenu(!$('sidebar').classList.contains('open')));$('backdrop').addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});render();
</script></body></html>
