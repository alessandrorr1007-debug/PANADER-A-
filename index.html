<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panadería · SaaS</title>
<style>
:root{--bg:#f7f7f5;--paper:#fff;--ink:#222722;--muted:#69736b;--line:#e4e7e1;--brand:#38634e;--tint:#e8f0e9;--warm:#8d531e;--warmbg:#fff1db}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #729b83;outline-offset:2px}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}aside{background:var(--paper);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.5px}.mark{background:var(--brand);color:white;border-radius:12px;width:39px;height:39px;display:grid;place-items:center;font-size:22px}.muted,small{color:var(--muted)}small{font-size:12px}.workspace{border:1px solid var(--line);border-radius:12px;padding:10px}.workspace label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.workspace select{width:100%;border:0;background:transparent;font-weight:650;color:var(--ink)}nav{display:grid;gap:4px}nav p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:14px 10px 4px}nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;color:var(--muted);display:flex;gap:11px;align-items:center}nav button.active{background:var(--tint);color:var(--brand);font-weight:700}nav button:hover{background:var(--bg)}.foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0}main{min-width:0}header{background:var(--paper);border-bottom:1px solid var(--line);padding:15px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}.demo{background:var(--warmbg);color:var(--warm);font-size:12px;padding:5px 10px;border-radius:6px;font-weight:650}.content{max-width:1320px;margin:auto;padding:28px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}h1,h2,p{margin:0}h1{font-size:28px;letter-spacing:-.8px;line-height:1.2;margin-bottom:7px}h2{font-size:16px;letter-spacing:-.2px}.btn{border:1px solid var(--line);border-radius:8px;background:white;padding:9px 12px;color:var(--ink);white-space:nowrap}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0}.metric{font-size:27px;font-weight:750;letter-spacing:-.8px;margin:8px 0 2px}.columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.chart{height:200px;display:flex;gap:12px;align-items:flex-end;border-bottom:1px solid var(--line);padding:0 8px}.barcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.bar{background:#83ab92;width:65%;max-width:45px;border-radius:6px 6px 0 0}.barcol:last-child .bar{background:var(--brand)}.barcol small{padding-bottom:6px}.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.tag{font-size:12px;font-weight:650;background:var(--tint);color:var(--brand);padding:4px 8px;border-radius:6px;white-space:nowrap;align-self:center}.tag.warn{background:var(--warmbg);color:var(--warm)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left}th,td{padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600;background:#f8faf7}tbody tr:last-child td{border-bottom:0}.search{border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:min(100%,280px);background:#fff}.empty{padding:24px;text-align:center;color:var(--muted)}.mobile{display:none}footer{margin-top:20px;color:var(--muted);font-size:12px}.backdrop{display:none}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}
@media(max-width:700px){.shell{display:block}aside{display:none;position:fixed;left:0;top:0;width:min(270px,85vw);z-index:5;box-shadow:0 0 30px #0002}aside.open{display:flex}.backdrop.open{display:block;position:fixed;inset:0;background:#0005;z-index:4;border:0;width:100%}.mobile{display:inline-block}.content{padding:18px 14px}header{padding:12px 14px}.heading{flex-wrap:wrap}h1{font-size:24px}.card{padding:14px}.metrics{gap:9px}.metric{font-size:23px}.chart{gap:5px}.cardhead{flex-wrap:wrap}.demo{font-size:11px}}

/* Fase 2 */
:root{color-scheme:light;--surface:#f8faf7;--hover:#f0f5ef;--shadow:0 2px 6px #243b2810}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151a17;--paper:#202722;--ink:#ecf1eb;--muted:#aebbb0;--line:#39443c;--brand:#8cc5a1;--tint:#2d4436;--warm:#f2c18c;--warmbg:#47351f;--surface:#252e27;--hover:#2a362d;--shadow:none}
.card,.btn,.search,header,aside{background:var(--paper);color:var(--ink)}.card{box-shadow:var(--shadow)}th{background:var(--surface)}tbody tr:hover{background:var(--hover)}.primary,.mark{background:var(--brand);color:var(--bg)}:root:not([data-theme="dark"]) .primary,:root:not([data-theme="dark"]) .mark{color:white}.header-actions,.filters,.quick-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.icon-btn{min-width:38px;min-height:38px;padding:7px}.nav-icon{width:19px;height:19px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.btn:hover{border-color:var(--brand)}.filters select{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:9px}.filters .search{flex:1;width:auto;min-width:120px}.quick-actions{margin-bottom:18px}.quick-actions .btn{display:flex;align-items:center;gap:8px}.summaryline{font-size:12px;color:var(--muted);margin-top:10px}.skip{position:fixed;top:-100px;left:10px;background:var(--paper);color:var(--ink);padding:12px;z-index:10}.skip:focus{top:8px}.tablewrap:focus-visible{outline:2px solid var(--brand)}.metric{font-variant-numeric:tabular-nums}.cardhead{margin-bottom:12px}header{position:sticky;top:0;z-index:2}.empty[hidden],tr[hidden]{display:none}
@media(max-width:700px){.btn{min-height:42px}nav button{min-height:44px}.header-actions{gap:4px}.header-actions .demo{display:none}.filters{width:100%}.filters .search{min-width:100px}.quick-actions .btn{flex:1;justify-content:center}.chart .barcol small{font-size:10px}}
@media(max-width:360px){.metrics{grid-template-columns:1fr}.chart .barcol small{font-size:9px}.quick-actions .btn{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head>
<body><a class="skip" href="#content">Saltar al contenido</a><div class="shell"><button class="backdrop" id="backdrop" aria-label="Cerrar menú"></button><aside id="sidebar">
<div class="logo"><span class="mark" aria-hidden="true">♨</span><div>Panadería<small style="display:block;font-weight:400;letter-spacing:0">Gestión de negocios</small></div></div>
<div class="workspace"><label for="business">Negocio de demostración</label><select id="business"><option value="a">Panadería Aurora</option><option value="b">Panadería Trigal</option></select></div>
<nav id="nav" aria-label="Módulos"></nav><div class="foot"><strong>Cuenta de demostración</strong><br><small>Administrador · Sin conexión</small></div></aside>
<main><header><div><button class="btn mobile" id="menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">☰</button> <span class="muted" id="crumb">Inicio / Resumen</span></div><div class="header-actions"><span class="demo">Modo demostración</span><button class="btn icon-btn" id="theme" aria-label="Activar modo oscuro" aria-pressed="false">☾</button></div></header><div class="content" id="content" tabindex="-1"></div></main></div>
<script>
'use strict';
const sections=[['General',[['dashboard','▦','Resumen']]],['Operaciones',[['warehouse','▤','Almacén'],['ingredients','◈','Insumos'],['recipes','▧','Recetas'],['production','◷','Producción']]],['Comercial',[['sales','▣','Ventas'],['purchases','↓','Compras'],['reports','▥','Reportes']]],['Administración',[['settings','⚙','Configuración']]]];
const samples={a:{name:'Panadería Aurora',sales:1540,units:420,series:[510,680,590,810,960,1120,1540],stock:[['Harina de trigo',12,'kg',20,3.4],['Azúcar',8,'kg',10,4.2],['Levadura',2,'kg',3,18],['Mantequilla',15,'kg',5,22]],recipes:[['Pan francés',100,28.40],['Pan integral',60,32.10],['Croissant',40,48.50]],production:[['Lote A-001','Pan francés',100,'Completado'],['Lote A-002','Croissant',40,'Planificado']],moves:[['Entrada','Mantequilla','5 kg'],['Salida','Harina de trigo','8 kg'],['Entrada','Azúcar','10 kg']]},b:{name:'Panadería Trigal',sales:860,units:230,series:[210,330,420,390,520,720,860],stock:[['Harina de trigo',28,'kg',15,3.6],['Sal',2,'kg',4,1.8],['Aceite',6,'L',3,9.5]],recipes:[['Pan de yema',80,36],['Pan ciabatta',40,19]],production:[['Lote B-001','Pan de yema',80,'Completado']],moves:[['Entrada','Harina de trigo','20 kg'],['Salida','Aceite','2 L']]}};
const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',warehouse:'M3 10l9-7 9 7v11H3z M7 21V11h10v10 M7 15h10 M7 18h10',ingredients:'M12 3l8 4v10l-8 4-8-4V7z M4 7l8 4 8-4 M12 11v10',recipes:'M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z M8 4v16 M11 9h5 M11 13h5',production:'M3 12h18 M5 12V8l4-4 4 4v4 M3 12v8h18v-8 M9 20v-4 M15 20v-4',sales:'M3 4h2l2 12h12l2-9H6 M9 21h.01 M18 21h.01',purchases:'M4 12v8h16v-8 M12 3v12 M7 10l5 5 5-5',reports:'M4 3v17h17 M8 16v-5 M13 16V6 M18 16v-8',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2'};
const icon=k=>'<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[k]+'"/></svg>';
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').trim();
const validPages=sections.flatMap(s=>s[1]).map(r=>r[0]);
const route=s=>validPages.includes(s)?s:'dashboard';
const matches=(text,q,status,selected)=>normalize(text).includes(normalize(q))&&(!selected||status===selected);
const chartSummary=d=>d.series.reduce((a,b)=>a+b,0);
let page=route(location.hash.slice(1)),tenant='a';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(n);
const tag=(s,w=false)=>'<span class="tag'+(w?' warn':'')+'">'+s+'</span>';
const low=d=>d.stock.filter(r=>r[1]<r[3]);
const heading=(title,desc,action='')=>'<div class="heading"><div><h1 tabindex="-1">'+title+'</h1><p class="muted">'+desc+'</p></div>'+action+'</div>';
const metric=(name,value,desc)=>'<section class="card"><small>'+name+'</small><div class="metric">'+value+'</div><small>'+desc+'</small></section>';
const table=(heads,rows)=>'<div class="tablewrap" tabindex="0" role="region" aria-label="Tabla desplazable"><table><thead><tr>'+heads.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr data-status="'+(r[r.length-1].toString().includes('Stock bajo')?'low':r[r.length-1].toString().includes('Disponible')?'ok':r[r.length-1].toString().includes('Planificado')?'planned':r[r.length-1].toString().includes('Completado')?'done':'')+'">'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="empty no-results" hidden>Sin resultados</p></div>';
const panel=(title,body,extra='')=>'<section class="card"><div class="cardhead"><h2>'+title+'</h2>'+extra+'</div>'+body+'</section>';
const search='<input class="search" id="filter" type="search" placeholder="Buscar en la tabla…" aria-label="Buscar en la tabla">';
const filters=kind=>'<div class="filters">'+search+(kind?'<select id="status-filter" aria-label="Filtrar por estado"><option value="">Todos los estados</option>'+(kind==='stock'?'<option value="low">Stock bajo</option><option value="ok">Disponible</option>':'<option value="planned">Planificado</option><option value="done">Completado</option>')+'</select>':'')+'</div>';
const quick=()=>'<div class="quick-actions">'+[['warehouse','Ver almacén'],['recipes','Consultar recetas'],['production','Ver producción']].map(([k,label])=>'<button class="btn" data-go="'+k+'">'+icon(k)+label+'</button>').join('')+'</div>';
const stockRows=d=>d.stock.map(r=>[r[0],r[1]+' '+r[2],r[3]+' '+r[2],money(r[4])+' / '+r[2],tag(r[1]<r[3]?'Stock bajo':'Disponible',r[1]<r[3])]);
function dashboard(d){const max=Math.max(...d.series);return heading('Resumen del negocio','Consulta la actividad de '+d.name+'.','<button class="btn primary" data-go="production">Ver producción</button>')+'<div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Importe simulado')+metric('Unidades vendidas',d.units,'Registro simulado')+metric('Insumos con stock bajo',low(d).length,'Por debajo del mínimo')+metric('Recetas activas',d.recipes.length,'Catálogo de ejemplo')+'</div>'+quick()+'<div class="columns">'+panel('Ventas de la semana','<div class="chart" role="img" aria-label="Ventas de ejemplo de lunes a domingo: '+d.series.join(', ')+' soles">'+d.series.map((v,i)=>'<div class="barcol"><small>'+v+'</small><div class="bar" style="height:'+Math.round(v/max*78)+'%"></div><small>'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i]+'</small></div>').join('')+'</div>', '<small>Total: '+money(chartSummary(d))+' · Simulado</small>')+panel('Alertas de inventario',low(d).map(r=>'<div class="item"><div><strong>'+r[0]+'</strong><br><small>Mínimo: '+r[3]+' '+r[2]+'</small></div>'+tag(r[1]+' '+r[2],true)+'</div>').join('')+'<button class="btn" data-go="warehouse" style="margin-top:12px">Ir al almacén</button>')+'</div>'+panel('Producción reciente',table(['Lote','Producto','Unidades','Estado'],d.production.map(r=>[...r.slice(0,3),tag(r[3],r[3]==='Planificado')])), '<button class="btn" data-go="production">Ver lotes</button>');}
function render(){const d=samples[tenant];const label=sections.flatMap(s=>s[1]).find(x=>x[0]===page)[2];$('crumb').textContent='Inicio / '+label;let content='';
switch(page){case 'dashboard':content=dashboard(d);break;
case 'warehouse':content=heading('Almacén','Existencias y movimientos de materias primas.')+panel('Inventario',table(['Insumo','Existencia','Mínimo','Costo unitario','Estado'],stockRows(d)),filters('stock'))+'<div style="height:16px"></div>'+panel('Movimientos recientes',table(['Tipo','Insumo','Cantidad'],d.moves));break;
case 'ingredients':content=heading('Insumos','Consulta unidades, existencias y costos de referencia.')+panel('Catálogo de insumos',table(['Insumo','Existencia','Mínimo','Costo unitario','Estado'],stockRows(d)),filters('stock'));break;
case 'recipes':content=heading('Recetas','Rendimientos y costos de referencia por lote.')+panel('Recetas registradas',table(['Producto','Rendimiento (unidades)','Costo por lote','Costo por unidad'],d.recipes.map(r=>[r[0],r[1],money(r[2]),money(r[2]/r[1])])),filters());break;
case 'production':content=heading('Producción','Visualiza los lotes y sus estados.')+panel('Lotes de producción',table(['Lote','Producto','Unidades','Estado'],d.production.map(r=>[...r.slice(0,3),tag(r[3],r[3]==='Planificado')])),filters('production'));break;
case 'sales':content=heading('Ventas','Indicadores de ejemplo. El punto de venta aún no está implementado.')+'<div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Simulación')+metric('Unidades',d.units,'Simulación')+'</div>';break;
case 'purchases':content=heading('Compras','Abastecimiento y proveedores: módulo planificado.')+panel('Compras','<p class="muted">Todavía no se registran órdenes de compra ni proveedores.</p>');break;
case 'reports':content=heading('Reportes','Indicadores disponibles en esta demostración.')+'<div class="metrics">'+metric('Ventas de hoy',money(d.sales),'Simulación')+metric('Insumos con stock bajo',low(d).length,'Simulación')+'</div>';break;
case 'settings':content=heading('Configuración','Espacio de trabajo y administración.')+panel('Negocio seleccionado','<strong>'+d.name+'</strong><p class="muted">El selector permite comparar dos conjuntos de datos ficticios. No existe autenticación ni aislamiento real de datos todavía.</p>');break;}
$('content').innerHTML=content+'<footer>Prototipo visual · Datos ficticios · Sin operaciones reales ni almacenamiento persistente.</footer>';document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.go===page);if(b.dataset.go===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const filter=$('filter');if(filter){const root=filter.closest('.card');const status=$('status-filter');const rows=[...root.querySelectorAll('tbody tr')];const countLabel=document.createElement('p');countLabel.className='summaryline';countLabel.setAttribute('aria-live','polite');root.append(countLabel);const apply=()=>{let count=0;rows.forEach(tr=>{tr.hidden=!matches(tr.textContent,filter.value,tr.dataset.status,status?.value);if(!tr.hidden)count++});root.querySelector('.no-results').hidden=count>0;countLabel.textContent=count+' de '+rows.length+' registros'};filter.addEventListener('input',apply);status?.addEventListener('change',apply);apply();}}
function setMenu(open){$('sidebar').classList.toggle('open',open);$('backdrop').classList.toggle('open',open);$('menu').setAttribute('aria-expanded',String(open));}
$('nav').innerHTML=sections.map(s=>'<p>'+s[0]+'</p>'+s[1].map(r=>'<button data-go="'+r[0]+'">'+icon(r[0])+r[2]+'</button>').join('')).join('');
function navigate(next){page=route(next);render();setMenu(false);document.querySelector('h1')?.focus();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){if(location.hash.slice(1)===b.dataset.go)navigate(b.dataset.go);else location.hash=b.dataset.go}});
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){$('content').focus();return}navigate(location.hash.slice(1))});
function applyTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'☀':'☾';$('theme').setAttribute('aria-label',dark?'Activar modo claro':'Activar modo oscuro');$('theme').setAttribute('aria-pressed',String(dark));}
let storedTheme;try{storedTheme=localStorage.getItem('panaderia-theme')}catch{}
applyTheme(storedTheme==='dark'||(!storedTheme&&window.matchMedia('(prefers-color-scheme: dark)').matches));
$('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';applyTheme(dark);try{localStorage.setItem('panaderia-theme',dark?'dark':'light')}catch{}});
$('business').addEventListener('change',e=>{tenant=e.target.value;render()});$('menu').addEventListener('click',()=>setMenu(!$('sidebar').classList.contains('open')));$('backdrop').addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});render();
</script></body></html>
